# DSPin with the on-screen UI: the full build, and the one to flash unless you
# have a reason not to.
#
# Everything that makes the player a player -- the board, the DSPi control
# link, the I2S clocking, Sendspin itself -- lives in dspin-basic.yaml, which
# this file includes as a package and then adds a display to. That split is not
# cosmetic: dspin-basic.yaml is flashable on its own for a headless streamer,
# and because it is included rather than copied there is only one copy of the
# audio path to keep correct.
#
# So read dspin-basic.yaml for the player and this file for the panel. The
# BEFORE FLASHING note about the DSPi's one-time USB setup is over there too,
# and it applies just the same here.
#
# What this adds: album artwork filling the screen, artist and title, a track
# details page, and touch controls for volume, mute and transport.

packages:
  base: !include dspin-basic.yaml

# The spectrum analyser belongs to the display, not the player: a headless
# build has nothing to draw it on, so the DSPi should never be asked to spend
# FFT time producing it. The hub itself lives in the base config; only the
# analyser settings and the drawing are added here.
#
# One channel, not two. The DSPi rotates a single FFT engine over the selected
# channels, so a stereo pair would halve the frame rate to ~23 fps each, and
# one bar set gets the full height of a 240-pixel panel.
#
# The input tap is chosen deliberately over the output tap: it sits after the
# per-input PEQ but before the matrix and master volume, so the bars show what
# is playing rather than shrinking every time the volume is turned down.
dspi:
  - id: !extend dspi_hub
    rta:
      tap: input
      channel_mask: 0x01
      fft_order: 10
      avg_ms: 250
      peak_decay_db_s: 20
      # Slightly ahead of what the panel can repaint (~20-25 fps, limited by
      # the blocking SPI flush) so a fresh frame is always waiting, but not so
      # fast that we re-read frames the device has not replaced yet: it
      # publishes one about every 21 ms for a single channel at 1024 points.
      interval: 40ms
    on_rta_band_frame:
      - lambda: |-
          lv_obj_t *cv = id(spectrum_canvas);
          constexpr int W = 272;
          constexpr int H = 140;
          constexpr float FLOOR_DB = -60.0f;

          lv_canvas_fill_bg(cv, lv_color_hex(0x000000), LV_OPA_COVER);

          lv_layer_t layer;
          lv_canvas_init_layer(cv, &layer);
          lv_draw_rect_dsc_t dsc;
          lv_draw_rect_dsc_init(&dsc);
          dsc.bg_opa = LV_OPA_COVER;
          dsc.border_width = 0;
          dsc.radius = 0;

          // Gridlines at 0, -20 and -40 dBFS. -60 is the baseline and needs no
          // line of its own.
          dsc.bg_color = lv_color_hex(0x1E2A38);
          for (int db = 0; db >= -40; db -= 20) {
            const int gy = (int) ((1.0f - (db - FLOOR_DB) / -FLOOR_DB) * (H - 1) + 0.5f);
            lv_area_t a = {0, gy, W - 1, gy};
            lv_draw_rect(&layer, &dsc, &a);
          }

          // Pitch is derived from the band count the device reports rather
          // than assumed: it is 34 at 44.1/48 kHz but 37 at 96 kHz.
          const int n = x.frame.n_bands;
          if (n > 0) {
            const int pitch = W / n;
            const int bw = pitch > 2 ? pitch - 2 : 1;
            const lv_color_t bar_col = x.live ? lv_color_hex(0x00E0A0) : lv_color_hex(0x33514A);
            const lv_color_t peak_col = x.live ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x5A5A5A);
            for (int i = 0; i < n; i++) {
              const int bx = i * pitch;
              // fraction() pins an empty band to exactly 0, so bands with no
              // FFT bin inside them read as gaps rather than as full-scale.
              const int bh = (int) (x.fraction(x.frame.avg[i], FLOOR_DB) * H + 0.5f);
              if (bh > 0) {
                dsc.bg_color = bar_col;
                lv_area_t a = {bx, H - bh, bx + bw - 1, H - 1};
                lv_draw_rect(&layer, &dsc, &a);
              }
              const int ph = (int) (x.fraction(x.frame.peak[i], FLOOR_DB) * H + 0.5f);
              if (ph > 0) {
                dsc.bg_color = peak_col;
                lv_area_t a = {bx, H - ph, bx + bw - 1, H - ph};
                lv_draw_rect(&layer, &dsc, &a);
              }
            }
          }
          lv_canvas_finish_layer(cv, &layer);
          lv_obj_invalidate(cv);

      # The trigger also fires once on the way into "not live", so the status
      # line settles rather than flickering every frame.
      - lvgl.label.update:
          id: spectrum_status
          text: !lambda |-
            if (!x.live) return std::string("no signal");
            char buf[24];
            const uint32_t hz = id(dspi_hub)->rta_status().sample_rate_hz;
            if (hz) snprintf(buf, sizeof(buf), "%u.%u kHz", (unsigned) (hz / 1000), (unsigned) ((hz % 1000) / 100));
            else snprintf(buf, sizeof(buf), "%u bands", (unsigned) x.frame.n_bands);
            return std::string(buf);

# A firmware without the analyser never sends a frame, so the trigger above
# never fires and the status line would sit on "starting..." forever. This is
# the only thing that can report that, and it runs only while the page is up.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: spectrum
              - lambda: "return !id(dspi_hub)->rta_available();"
          then:
            - lvgl.label.update:
                id: spectrum_status
                text: "unavailable"

# Entities defined in the base, extended here to drive the display. `!extend`
# reaches an existing list item by id and merges into it; without it these
# blocks would be appended as second, conflicting definitions, because package
# merging concatenates lists rather than matching them up.
text_sensor:
  - id: !extend track_title
    on_value:
      - lvgl.label.update:
          id: title_label
          text: !lambda "return x;"
  - id: !extend track_artist
    on_value:
      - lvgl.label.update:
          id: artist_label
          text: !lambda "return x;"

  # Album and album artist are only shown on the details page, so unlike title
  # and artist they are not in the base config at all.
  - platform: sendspin
    sendspin_id: sendspin_hub
    type: album
    name: Album
    id: track_album
    on_value:
      - lvgl.label.update:
          id: album_label
          text: !lambda "return x;"
  - platform: sendspin
    sendspin_id: sendspin_hub
    type: album_artist
    name: Album Artist
    id: track_album_artist
    on_value:
      - lvgl.label.update:
          id: album_artist_label
          text: !lambda "return x;"

number:
  # Keep the on-screen slider in step with changes made anywhere else (Home
  # Assistant, the DSPi's own front panel). slider.update deliberately does
  # not emit VALUE_CHANGED, so this cannot loop back into the slider's own
  # automation.
  - id: !extend dspi_volume
    on_value:
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda "return (int) x;"
      - lvgl.label.update:
          id: volume_label
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f dB", x);
            return std::string(buf);

switch:
  # The mute button is a checkable LVGL button, so its checked state has to
  # follow the switch rather than only being set by tapping it.
  - id: !extend dspi_mute
    on_turn_on:
      - lvgl.widget.update:
          id: mute_btn
          state:
            checked: true
    on_turn_off:
      - lvgl.widget.update:
          id: mute_btn
          state:
            checked: false

media_player:
  # The play/pause glyph is driven from on_play/on_idle, NOT on_pause:
  # SendspinMediaSource never reports PAUSED. Pausing stops the stream and the
  # player goes IDLE, so on_pause would never fire and is_paused is always
  # false. media_player.toggle still does the right thing, mapping to PLAY
  # from IDLE.
  - id: !extend dspi_media
    on_play:
      - lvgl.button.update:
          id: play_btn
          text: "\U0000F04C"
    on_idle:
      - lvgl.button.update:
          id: play_btn
          text: "\U0000F04B"

# Track position, for the progress bar on the details page. Internal: this
# polls once a second and is only of interest on the panel itself -- there is
# no reason to push a 1 Hz stream of it into Home Assistant.
sensor:
  - platform: sendspin
    sendspin_id: sendspin_hub
    type: track_progress
    id: track_progress_ms
    internal: true
    on_value:
      - script.execute: refresh_progress
  - platform: sendspin
    sendspin_id: sendspin_hub
    type: track_duration
    id: track_duration_ms
    internal: true
    on_value:
      - script.execute: refresh_progress

# Both the bar and the elapsed/total labels depend on the same two sensors, so
# they are refreshed together rather than each sensor updating half of it.
script:
  - id: refresh_progress
    then:
      - lvgl.bar.update:
          id: progress_bar
          value: !lambda |-
            float pos = id(track_progress_ms).state;
            float len = id(track_duration_ms).state;
            if (std::isnan(pos) || std::isnan(len) || len <= 0) return 0;
            return (int) (100.0f * pos / len);
      - lvgl.label.update:
          id: progress_label
          text: !lambda |-
            auto mmss = [](float ms) -> std::string {
              if (std::isnan(ms) || ms < 0) return std::string("--:--");
              int total = (int) (ms / 1000.0f);
              char buf[16];
              snprintf(buf, sizeof(buf), "%d:%02d", total / 60, total % 60);
              return std::string(buf);
            };
            return mmss(id(track_progress_ms).state) + " / " +
                   mmss(id(track_duration_ms).state);

# --- Display -----------------------------------------------------------------
#
# The ESP32-S3-BOX-3's 320x240 panel, showing album art plus artist and title
# while something is playing. Pin assignments are from Espressif's own BSP
# (bsp/esp-box-3/include/bsp/esp-box-3.h) and none of them collide with the
# five GPIOs the DSPi link uses.
#
# Display settings follow Espressif's own ESPHome config for this board: the
# mipi_spi S3BOX model, colours not inverted, and a reset line that is active
# low. That last one is easy to get wrong and leaves the panel dark.

spi:
  - id: lcd_spi
    clk_pin: GPIO7
    mosi_pin: GPIO6

# The Box-3's I2C bus, shared by the touch controller and the board's audio
# codecs (we use none of the latter -- audio goes out over I2S to the DSPi).
i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO18

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO47

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 20
  - file: "gfonts://Roboto"
    id: font_artist
    size: 16

# Album artwork, decoded straight into a drawable image. `resize` is what the
# server is asked to send, so it is sized for the panel rather than scaled
# here. 240x240 matches the panel height, so the foreground layer below needs
# no LVGL-side scaling; the background layer reuses the same decode, just
# zoomed up, rather than requesting and decoding a second copy.
image:
  - platform: sendspin
    sendspin_id: sendspin_hub
    id: artwork_slot
    source: ALBUM
    format: JPEG
    type: RGB565
    resize: 240x240
    # The artwork is opaque JPEG, so this looks wrong -- it is what makes the
    # zoomed background below draw at all.
    #
    # LVGL's software transform only compiles in its RGB565 case when
    # LV_DRAW_SW_SUPPORT_RGB565A8 is enabled as well (it reaches the same
    # routine with has_alpha=false), and ESPHome enables that define only for
    # images declared transparent. Left opaque, bg_image's `zoom` silently drew
    # nothing and LVGL logged "Color format 0x12 is not enabled" once per block
    # -- 270 lines per full-screen repaint, about 700 ms of main loop, enough to
    # push Sendspin past its buffer and resync. Measured, on hardware.
    #
    # The cost is an alpha byte per pixel in the decode buffer, ~57 KB of PSRAM
    # at 240x240, which this board has to spare.
    transparency: alpha_channel
    current_image:
      id: album_art
    # Fires when the artwork for the now-playing track is ready to show.
    on_image_display:
      - lvgl.widget.show: [bg_image, fg_image]
      # widget.redraw only invalidates for repaint; it won't pick up a changed
      # image src/dimensions. image.update re-applies src, forcing LVGL to
      # re-read the now-decoded buffer.
      - lvgl.image.update:
          id: bg_image
          src: album_art
      - lvgl.image.update:
          id: fg_image
          src: album_art
    on_image_clear:
      - lvgl.widget.hide: [bg_image, fg_image]

display:
  - platform: mipi_spi
    id: lcd
    model: S3BOX
    spi_id: lcd_spi
    invert_colors: false
    data_rate: 40MHz
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin:
      number: GPIO48
      inverted: true
    # LVGL (below) owns rendering to this display and manages its own dirty
    # regions, so there is no lambda here and no periodic redraw to configure.
    update_interval: never

# Capacitive touch, which is what makes the controls and page swiping work.
#
# This block must come AFTER display: and not before it. On the Box-3 the touch
# reset and the LCD reset are the same net (GPIO48), which `display:` owns.
# Components with equal setup priority are set up in the order they appear
# here, so configured earlier the GT911 would probe I2C while the panel had yet
# to release that shared reset -- and the panel's reset pulse would then reset
# the touch controller straight after, throwing away what the driver had just
# read from it. Probing after the panel is initialised avoids both.
#
# Deliberately no reset_pin here for the same shared-net reason: driving it
# from this side too would blank the panel. Without a reset pulse of its own
# the controller keeps whatever address it powered up with, so the driver
# probes 0x5D and falls back to 0x14.
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_i2c
    display: lcd

# Full-screen "now playing" view: the album art doubles as its own backdrop --
# a zoomed, darkened copy fills the panel edge-to-edge behind the crisp,
# undistorted artwork, so there is never a hard black margin around non-square
# art. A bottom gradient scrim keeps title/artist legible over whatever colors
# the artwork happens to have. True blur isn't practical in real time on this
# hardware, so the ambient fill is a zoom + darken of the same decode instead
# of a second, blurred one.
lvgl:
  displays:
    - lcd
  touchscreens:
    - touch
  # Two pages today, so wrapping means either swipe direction gets you to the
  # other one. A third page (a spectrum analyser) needs no rewiring.
  page_wrap: true
  # The controls are an overlay on the artwork, not permanent furniture: they
  # appear on a tap and retire again once the screen has been left alone. LVGL
  # drives this from its own input-inactivity timer, so any touch resets it.
  on_idle:
    timeout: 8s
    then:
      - lvgl.widget.hide: controls_panel
  gradients:
    - id: scrim_gradient
      direction: VER
      stops:
        - color: 0x000000
          opa: 0%
          position: 0%
        - color: 0x000000
          opa: 80%
          position: 100%
  pages:
    - id: now_playing
      bg_color: 0x000000
      # A tap anywhere on the artwork brings the controls up; on_idle above
      # takes them away again.
      #
      # A swipe ends in a click too (LVGL only suppresses CLICKED for scrolls,
      # and this page is not scrollable), which would flash the controls up on
      # the way to the next page. LVGL clears gesture_dir on the next press
      # rather than on release, so it still reads as a direction here and
      # distinguishes the two.
      on_click:
        - if:
            condition:
              lambda: "return lv_indev_get_gesture_dir(lv_indev_active()) == LV_DIR_NONE;"
            then:
              - lvgl.widget.show: controls_panel
      on_swipe_left:
        - lvgl.page.next:
            animation: OVER_LEFT
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: OVER_RIGHT
            time: 200ms
      widgets:
        - image:
            id: bg_image
            src: album_art
            align: CENTER
            zoom: 1.34 # 320/240, scales the 240x240 source to cover 320x240
            image_recolor: 0x000000
            image_recolor_opa: 51%
            hidden: true
        - image:
            id: fg_image
            src: album_art
            align: CENTER
            hidden: true
        - obj:
            id: text_scrim
            x: 0
            y: 150
            width: 320
            height: 90
            align: TOP_LEFT
            radius: 0
            border_width: 0
            pad_all: 0
            bg_grad: scrim_gradient
            # Purely decorative, and an obj is clickable by default: without
            # this, taps and swipes over the bottom third would be swallowed
            # here instead of reaching the page underneath.
            clickable: false
        - label:
            id: artist_label
            x: 16
            y: 166
            width: 288
            text_font: font_artist
            text_color: 0xCCCCCC
            long_mode: SCROLL_CIRCULAR
            text: ""
        - label:
            id: title_label
            x: 16
            y: 196
            width: 288
            text_font: font_title
            text_color: 0xFFFFFF
            long_mode: SCROLL_CIRCULAR
            text: ""

        # Page indicator. Each page carries its own set of dots with the
        # filled one already in the right place, so there is nothing to update
        # when the page changes. Not clickable, so taps and swipes along the
        # bottom edge still reach the page.
        - obj:
            align: BOTTOM_MID
            x: -18
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            border_width: 0
            clickable: false
            bg_color: 0xFFFFFF
            bg_opa: 100%
        - obj:
            align: BOTTOM_MID
            x: 0
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            clickable: false
            bg_opa: 0%
            border_width: 1
            border_color: 0xFFFFFF
            border_opa: 70%
        - obj:
            align: BOTTOM_MID
            x: 18
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            clickable: false
            bg_opa: 0%
            border_width: 1
            border_color: 0xFFFFFF
            border_opa: 70%

        # Controls, last in the list so they sit on top of everything else.
        # They live in the band above the scrim so artist and title stay
        # readable while the controls are up.
        #
        # The glyphs are FontAwesome codepoints from LVGL's built-in Montserrat
        # font (ESPHome has no LV_SYMBOL_* names, and the Roboto fonts above do
        # not carry these): F048 previous, F04B play, F04C pause, F051 next,
        # F026 mute.
        - obj:
            id: controls_panel
            hidden: true
            x: 0
            y: 84
            width: 320
            height: 66
            align: TOP_LEFT
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x000000
            bg_opa: 55%
            widgets:
              - obj:
                  x: 0
                  y: 2
                  width: 320
                  height: 40
                  radius: 0
                  border_width: 0
                  pad_all: 0
                  bg_opa: 0%
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER
                  widgets:
                    - button:
                        id: prev_btn
                        width: 56
                        height: 38
                        text_font: montserrat_20
                        text: "\U0000F048"
                        on_click:
                          - media_player.previous: dspi_media
                    - button:
                        id: play_btn
                        width: 56
                        height: 38
                        text_font: montserrat_20
                        text: "\U0000F04B"
                        on_click:
                          - media_player.toggle: dspi_media
                    - button:
                        id: next_btn
                        width: 56
                        height: 38
                        text_font: montserrat_20
                        text: "\U0000F051"
                        on_click:
                          - media_player.next: dspi_media
                    - button:
                        id: mute_btn
                        width: 56
                        height: 38
                        checkable: true
                        text_font: montserrat_20
                        text: "\U0000F026"
                        on_click:
                          - switch.toggle: dspi_mute
              # The DSPi's own volume, not the media player's: media_player
              # volume is software gain in the ESP32 speaker ahead of the DSP,
              # whereas user_volume is the DSPi's listening control and is what
              # its loudness compensation tracks.
              - slider:
                  id: volume_slider
                  x: 12
                  y: 48
                  width: 216
                  height: 10
                  min_value: -60
                  max_value: 0
                  value: -60
                  # The write waits for release on purpose: the DSPi UART link
                  # is single-in-flight with retries, so writing on every drag
                  # step would flood it. The label below still tracks the
                  # finger, so it does not feel laggy.
                  on_release:
                    - number.set:
                        id: dspi_volume
                        value: !lambda "return x;"
                  on_value:
                    - lvgl.label.update:
                        id: volume_label
                        text: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.0f dB", (float) x);
                          return std::string(buf);
              - label:
                  id: volume_label
                  x: 240
                  y: 44
                  width: 68
                  text_font: font_artist
                  text_color: 0xFFFFFF
                  text: "-- dB"

    # Track details. Also the page that proves swipe navigation works.
    - id: track_details
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.next:
            animation: OVER_LEFT
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: OVER_RIGHT
            time: 200ms
      widgets:
        - label:
            x: 16
            y: 16
            text_font: font_artist
            text_color: 0x888888
            text: "ALBUM"
        - label:
            id: album_label
            x: 16
            y: 38
            width: 288
            text_font: font_title
            text_color: 0xFFFFFF
            long_mode: SCROLL_CIRCULAR
            text: ""
        - label:
            id: album_artist_label
            x: 16
            y: 66
            width: 288
            text_font: font_artist
            text_color: 0xCCCCCC
            long_mode: SCROLL_CIRCULAR
            text: ""
        - bar:
            id: progress_bar
            x: 16
            y: 130
            width: 288
            height: 8
            min_value: 0
            max_value: 100
            value: 0
        - label:
            id: progress_label
            x: 16
            y: 148
            width: 288
            text_font: font_artist
            text_color: 0xCCCCCC
            text: "--:-- / --:--"

        # Same indicator, with the second dot filled instead.
        - obj:
            align: BOTTOM_MID
            x: -18
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            clickable: false
            bg_opa: 0%
            border_width: 1
            border_color: 0xFFFFFF
            border_opa: 70%
        - obj:
            align: BOTTOM_MID
            x: 0
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            border_width: 0
            clickable: false
            bg_color: 0xFFFFFF
            bg_opa: 100%
        - obj:
            align: BOTTOM_MID
            x: 18
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            clickable: false
            bg_opa: 0%
            border_width: 1
            border_color: 0xFFFFFF
            border_opa: 70%

    # Spectrum analyser. The DSPi does the FFT; this page only draws the band
    # table it publishes.
    #
    # Everything is drawn into a single canvas rather than one widget per band.
    # LVGL tracks at most LV_INV_BUF_SIZE (32) invalid areas and falls back to
    # redrawing the whole screen once that overflows, so 34 bars would repaint
    # all 320x240 every frame. The canvas is one invalidation of a region we
    # choose, and on this panel the SPI flush is the frame-rate limit: it is a
    # blocking, polled transfer, so 272x140 at 40 MHz costs ~15 ms against
    # ~31 ms for the full screen.
    - id: spectrum
      bg_color: 0x000000
      # The analyser is transient on the DSPi and stops itself when nobody
      # reads it, so it runs only while this page is actually on screen. A
      # spectrum nobody is looking at costs the DSPi real FFT and filter-bank
      # time on the same cores that run the audio path.
      on_load:
        - lambda: id(dspi_hub)->set_rta_enabled(true);
        - lvgl.label.update:
            id: spectrum_status
            text: "starting..."
      on_unload:
        - lambda: id(dspi_hub)->set_rta_enabled(false);
      on_swipe_left:
        - lvgl.page.next:
            animation: OVER_LEFT
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: OVER_RIGHT
            time: 200ms
      widgets:
        - label:
            x: 16
            y: 14
            text_font: font_artist
            text_color: 0x888888
            text: "SPECTRUM"
        - label:
            id: spectrum_status
            x: 120
            y: 14
            width: 184
            text_font: font_artist
            text_color: 0x888888
            text_align: RIGHT
            text: ""

        # dB scale. Static labels beside the canvas rather than text drawn into
        # it: they never change, so they cost nothing per frame.
        - label:
            x: 4
            y: 34
            text_font: font_artist
            text_color: 0x555555
            text: "0"
        - label:
            x: 4
            y: 80
            text_font: font_artist
            text_color: 0x555555
            text: "-20"
        - label:
            x: 4
            y: 126
            text_font: font_artist
            text_color: 0x555555
            text: "-40"
        - label:
            x: 4
            y: 164
            text_font: font_artist
            text_color: 0x555555
            text: "-60"

        - canvas:
            id: spectrum_canvas
            x: 40
            y: 40
            width: 272
            height: 140

        # Frequency axis. Positions match the third-octave band layout the
        # device reports: bands 0, 10, 20 and 30 are the 10 Hz, 100 Hz, 1 kHz
        # and 10 kHz centres, at a pitch of 272/34 = 8 px.
        - label:
            x: 38
            y: 184
            text_font: font_artist
            text_color: 0x555555
            text: "10"
        - label:
            x: 116
            y: 184
            text_font: font_artist
            text_color: 0x555555
            text: "100"
        - label:
            x: 196
            y: 184
            text_font: font_artist
            text_color: 0x555555
            text: "1k"
        - label:
            x: 274
            y: 184
            text_font: font_artist
            text_color: 0x555555
            text: "10k"

        # Same indicator, with the third dot filled.
        - obj:
            align: BOTTOM_MID
            x: -18
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            clickable: false
            bg_opa: 0%
            border_width: 1
            border_color: 0xFFFFFF
            border_opa: 70%
        - obj:
            align: BOTTOM_MID
            x: 0
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            clickable: false
            bg_opa: 0%
            border_width: 1
            border_color: 0xFFFFFF
            border_opa: 70%
        - obj:
            align: BOTTOM_MID
            x: 18
            y: -8
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            border_width: 0
            clickable: false
            bg_color: 0xFFFFFF
            bg_opa: 100%
