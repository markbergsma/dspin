# DSPin: a Sendspin player built from an ESP32-S3-BOX-3 and a DSPi.
#
# The ESP32 receives synchronized network audio over Sendspin and feeds it to
# the DSPi as I2S, while separately controlling the DSPi over UART so the DSP
# appears in Home Assistant.
#
# This is the whole player without the on-screen UI: flash it directly if you
# want streaming and Home Assistant control and nothing on the panel. It is
# also the base that dspin.yaml -- the full build, with artwork, metadata and
# touch controls -- includes and adds the display to, so everything here is
# common to both and there is only ever one copy of it.
#
# Why a board with PSRAM: Sendspin's stream buffer defaults to 1 MB. On an
# ESP32-S3 without PSRAM the sendspin components fail to initialise outright,
# and shrinking the buffer far enough to fit only moves the failure to the I2S
# speaker task, which can then no longer find a large enough contiguous block.
# See examples/phase0-box3-nopsram.yaml for the measurements.
#
# BEFORE FLASHING: the DSPi needs a one-time setup over USB to enable its UART
# control interface and put its I2S input into clock-slave mode. See the README
# section "One-time DSPi setup" -- the ESP32 cannot do this for itself, by
# design (the DSPi refuses interface configuration over the interface being
# configured, so a controller can never lock itself out).

substitutions:
  name: dspin
  friendly_name: DSPin

  # The rate of the I2S link, and the rate Sendspin asks the server for. 44.1 kHz
  # because practically all music is, so the common case becomes a pass-through
  # and only the minority of 48 kHz material gets resampled server-side.
  #
  # Only 44100 and 48000 are valid. The DSPi's clock-slave input locks to
  # 44.1 / 48 / 96 kHz, but ESPHome caps a speaker's sample_rate at 48000
  # (AUDIO_COMPONENT_SCHEMA, and primary-mode I2S advertises the same maximum),
  # so 96 kHz cannot be driven from here whatever the DSPi can accept.
  sample_rate: 44100

  # Every board-specific detail lives here. Porting to another ESP32 board
  # should mean editing this block and nothing else.
  #
  # The Box-3 routes 16 GPIOs to its PCIe edge connector:
  #   9, 10, 11, 12, 13, 14, 19, 20, 21, 38, 39, 40, 41, 42, 43, 44
  # The DOCK and the BREAD adapter are just different breakouts of that one
  # connector, so these five pins are the same either way; only where they sit
  # physically differs. On the DOCK they are all on PMOD1 (positions in the
  # comments below); on the BREAD they appear on the 36-pin header.
  #
  # Three of that 16 are deliberately not used: GPIO19 and GPIO20 are the USB
  # D+/D- lines used for flashing and logging, and GPIO42 is also SD_D2. Take
  # care on the BREAD, which has no functional labels to warn you off them.
  # None of the five below are strapping pins.
  i2s_bclk: GPIO39 # DOCK PMOD1 IO3 -> DSPi GPIO 27 (slave BCK)  + DAC BCK
  i2s_lrclk: GPIO40 # DOCK PMOD1 IO4 -> DSPi GPIO 28 (slave LRCLK) + DAC LRCK
  i2s_dout: GPIO41 # DOCK PMOD1 IO8 -> DSPi GPIO 1  (I2S RX data)
  dspi_uart_tx: GPIO38 # DOCK PMOD1 IO7 -> DSPi GPIO 17 (its UART RX)
  dspi_uart_rx: GPIO21 # DOCK PMOD1 IO5 <- DSPi GPIO 16 (its UART TX)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://markbergsma/esphome-dspi@main
    components: [dspi]

logger:
  level: INFO

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- Control link to the DSPi ----------------------------------------------

uart:
  - id: dspi_uart
    tx_pin: ${dspi_uart_tx}
    rx_pin: ${dspi_uart_rx}
    # Must match the baud set in UartCtrlConfig over USB. The protocol allows
    # 9600..1000000; a high rate keeps each exchange short.
    baud_rate: 460800
    data_bits: 8
    parity: NONE
    stop_bits: 1
    # The ESP-IDF driver drops silently on overflow, and a burst of
    # notifications during a preset load can outrun the 256-byte default.
    rx_buffer_size: 512

# Written as a list item rather than a bare mapping so dspin.yaml can reach it
# with `id: !extend dspi_hub` to add the display-only spectrum analyser config.
dspi:
  - id: dspi_hub
    uart_id: dspi_uart
    # We are the thing feeding the DSPi's I2S input, so claim that input once at
    # boot if it is set to something else. Deliberately once only: switching
    # sources resets the DSPi audio pipeline.
    boot_input_source: i2s
    # Notifications are enabled on the device, so no polling is needed.
    poll_interval: 0s

number:
  # What a listener turns, and what Music Assistant's volume maps onto -- see
  # the media_player's on_volume below, which routes it here. Same field as the
  # USB host's volume slider, and the one that drives the DSPi's loudness
  # compensation, so the equal-loudness contour tracks the real listening level.
  - platform: dspi
    dspi_id: dspi_hub
    type: user_volume
    name: Volume
    id: dspi_volume
    on_value:
      # The other half of that link, so the media player's slider follows this
      # one rather than drifting from it. Needed because the DSPi's volume also
      # moves on its own: from this entity, from a preset load, or from a knob
      # on a DSPi control surface.
      - lambda: |-
          const float target = 1.0f + x / 60.0f;
          const float delta = target - id(dspi_media)->volume;
          // Same idempotence guard as on_volume, in the other direction: that
          // trigger fires for the call below too, so without this the pair
          // would trade one redundant write per change.
          if (delta > 0.004f || delta < -0.004f) {
            id(dspi_media)->make_call().set_volume(target < 0.0f ? 0.0f : (target > 1.0f ? 1.0f : target)).perform();
          }

  # The output ceiling: how loud this system may ever get. A configuration
  # setting rather than a listening control, so it is categorised as config and
  # stays out of the way. Worth setting once to match your amplifier.
  - platform: dspi
    dspi_id: dspi_hub
    type: master_volume
    name: Master Volume
    id: dspi_master_volume

switch:
  - platform: dspi
    dspi_id: dspi_hub
    type: user_mute
    name: Mute
    id: dspi_mute

  # The DSP feature toggles. These do not persist: the DSPi holds them in RAM
  # and inside each preset, so loading a preset resets all four to whatever it
  # stored. Drop any you do not want -- an omitted toggle is not even polled.
  #
  # The ids are carried so dspin.yaml can reach them with `id: !extend` when
  # these get on-screen controls.
  - platform: dspi
    dspi_id: dspi_hub
    type: loudness
    name: Loudness
    id: dspi_loudness
  - platform: dspi
    dspi_id: dspi_hub
    type: eq_bypass
    name: EQ Bypass
    id: dspi_eq_bypass
  - platform: dspi
    dspi_id: dspi_hub
    type: crossfeed
    name: Crossfeed
    id: dspi_crossfeed
  - platform: dspi
    dspi_id: dspi_hub
    type: leveller
    name: Leveller
    id: dspi_leveller

select:
  - platform: dspi
    dspi_id: dspi_hub
    type: input_source
    name: Input Source
    id: dspi_input_source
    entity_category: config

  # A DSPi preset is the whole DSP state -- EQ, crossovers, delays, the matrix,
  # the output setup -- so this one entity reconfigures the processor. Not
  # categorised as config: unlike the input source, which is set once and then
  # left alone, switching between a late-night and a full-range voicing is
  # day-to-day listening control.
  #
  # EDIT THESE TO MATCH YOUR DSPi. The labels are yours, not the device's:
  # ESPHome fixes a select's options at startup, so they cannot be read from
  # the DSPi at runtime. To see what each slot actually holds, run
  # `python3 tools/dspi_setup.py` from esphome-dspi -- it lists all ten slots,
  # their names, and which are saved.
  #
  # Slot 0 is the only one a factory-fresh DSPi has named, which is why it is
  # the only one listed here. Add the slots you use:
  #
  #     slots:
  #       0: Default
  #       1: Movie
  #       3: Night
  #
  # Listing a slot you have never saved is allowed, but selecting it loads
  # factory defaults rather than stored settings.
  - platform: dspi
    dspi_id: dspi_hub
    type: preset
    name: Preset
    id: dspi_preset
    slots:
      0: Default

# The DSPi's preset-name sensor lives in the single `text_sensor:` block
# further down, next to the Sendspin track metadata -- ESPHome allows only one
# block per platform key.

# --- Audio path to the DSPi ------------------------------------------------
#
# The ESP32 is the I2S clock master and the DSPi is the clock slave, which is
# what lets the DSPi auto-detect the rate and servo its own outputs to our
# clock. 32-bit slots are required: the DSPi's slave mode expects
# BCK = 64 x Fs and does not detect the frame format at runtime.
#
# No MCLK pin is wired. The DSPi forces its own MCK output off while clock-
# slaved and does not want one from us, so that is a pin saved rather than a
# feature missing.
#
# Our two clock pads each drive two inputs: the DSPi's slave pair (GPIO 27/28)
# and the DAC's BCK/LRCK. That is not a convenience -- while clock-slaved the
# DSPi drives no clock at all, and its I2S output slot shifts data out on the
# external edges it is listening to, so the DAC can only get its clocks from
# us. See "The DAC shares our clock" in the README.

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}

speaker:
  - platform: i2s_audio
    id: dspi_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: ${i2s_dout}
    dac_type: external
    i2s_mode: primary
    bits_per_sample: 32bit
    channel: stereo
    sample_rate: ${sample_rate}
    # Accurate clock generation matters here: the DSPi locks to this clock and
    # rate-matches its own outputs to it.
    use_apll: true
    # Measured behaviour, so you know what to expect rather than guessing:
    # track changes cost nothing (Sendspin keeps the stream running across
    # them, and the DSPi holds lock with no losses and no slips), but an
    # explicit pause does stop BCLK/LRCLK within about 2 s. The DSPi then
    # drops to ACQUIRING and mutes its outputs until the clock returns,
    # re-locking cleanly in under 2 s on resume. So expect a beat of silence
    # after unpausing, and nothing at all between tracks.
    #
    # `timeout: never` does NOT prevent that: it governs bus teardown, not
    # clock output, and the clock stops regardless. It is kept because
    # avoiding the teardown churn is still worth having, not because it keeps
    # the DSPi locked.
    timeout: never

media_player:
  # speaker_source, not speaker: this is the platform that can be handed a
  # media_source to play from. A plain `speaker` media_player has no way to
  # reference the Sendspin source, so the device would receive the stream and
  # then have nowhere to put it.
  - platform: speaker_source
    id: dspi_media
    name: Player
    media_pipeline:
      speaker: dspi_speaker
      sources:
        - sendspin_source
    # Pin the ESP32's own volume at unity so it never scales the samples.
    #
    # Music Assistant sends one full-scale stream to every player in a group and
    # expects each to attenuate locally, and ESPHome's i2s_audio speaker obliges
    # by applying software gain in the data path (0..1 mapped to -49..0 dB). On
    # this board that is the wrong place to do it twice over: it throws away bit
    # depth ahead of a 24-bit link into a DSP that has a 60 dB gain stage of its
    # own, and it leaves the DSPi's loudness compensation keyed to a number that
    # no longer reflects the actual listening level.
    #
    # With min == max the remap always yields 1.0, except that a slider at zero
    # still passes through as silence.
    volume_min: 100%
    volume_max: 100%
    on_volume:
      # So the volume command becomes the DSPi's user_volume, and the DSP is the
      # only thing attenuating. Linear in dB across its -60..0 range, which is
      # the same taper the i2s_audio speaker used before, just wider and applied
      # downstream.
      - lambda: |-
          // Nothing until the DSPi has told us where it actually is.
          // speaker_source restores its saved volume in setup() and pushes it
          // through this very trigger, so without this gate an ESP32 reboot
          // would slam the DSP to whatever this board last had cached -- an
          // 18 dB jump if the two had drifted apart. The DSPi is the source of
          // truth, exactly as it is for every entity this component publishes;
          // dspi_volume's on_value pulls the slider to the device on the first
          // readback rather than the other way round.
          if (!id(dspi_hub)->state().user_volume_valid) return;

          const float target_db = -60.0f * (1.0f - x);
          // Idempotent: this also fires for a volume_set issued by dspi_volume's
          // own on_value below, and acting on that would send a redundant write
          // on every change. 0.25 dB is well under one step of either control.
          const float delta = target_db - id(dspi_hub)->state().user_volume_db;
          if (delta > 0.25f || delta < -0.25f) {
            id(dspi_hub)->set_user_volume_db(target_db);
          }

sendspin:
  id: sendspin_hub

media_source:
  - platform: sendspin
    id: sendspin_source
    sendspin_id: sendspin_hub
    # Must match the speaker above, hence the shared substitution: this is the
    # one rate we advertise, and the server converts to it. Nothing resamples on
    # the ESP32 -- the conversion happens server-side, which is why picking the
    # rate the music is already in avoids the work entirely.
    #
    # At any rate other than 48 kHz the component drops Opus from the advertised
    # codecs on its own, Opus being 48 kHz-only. That leaves FLAC and PCM, both
    # lossless, so it costs nothing here.
    sample_rate: ${sample_rate}

# Track metadata, which is also the quickest confirmation that audio is really
# flowing rather than merely that the device booted.
#
# These carry ids they do not need here so that dspin.yaml can reach them with
# `id: !extend` and hang display updates off them.
text_sensor:
  - platform: sendspin
    sendspin_id: sendspin_hub
    type: title
    name: Track Title
    id: track_title
  - platform: sendspin
    sendspin_id: sendspin_hub
    type: artist
    name: Track Artist
    id: track_artist

  # Not track metadata, but ESPHome allows one block per platform key, so the
  # DSPi's sensor belongs here too. It publishes the device's own name for
  # whichever preset slot is active: the preset select shows our label for it,
  # this shows the DSPi's, and it keeps working when the device is on a slot
  # that select does not list -- which is what happens whenever a preset is
  # loaded from DSPi Console rather than from here. Diagnostic, because
  # whenever both agree it merely repeats the select.
  - platform: dspi
    dspi_id: dspi_hub
    type: preset_name
    name: Preset Name
    id: dspi_preset_name
    entity_category: diagnostic
